<!doctype html>
<meta charset="utf-8">
<title>Unsaturated — your details</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 620px; margin: 32px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 18px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 16px 0; padding: 12px 14px; }
  legend { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #666; }
  label { display: block; margin: 8px 0 2px; font-size: 12px; color: #555; }
  input { width: 100%; padding: 7px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  button { margin-top: 14px; padding: 8px 14px; border: 0; border-radius: 6px; background: #e4572e; color: #fff; font: inherit; cursor: pointer; }
  .note { background: #f6f6f6; border-radius: 6px; padding: 10px; color: #444; font-size: 13px; }
  #saved { color: #1a7f37; margin-left: 10px; }
</style>
<h1>Your details</h1>
<p class="note">Stored in this browser only, in the extension's own storage. Nothing here is sent
anywhere except into an application form you open, when you press the toolbar button.
Diversity, disability and veteran questions are never filled by this extension.</p>

<fieldset><legend>Name</legend>
  <div class="row">
    <div><label>First name</label><input id="firstName"></div>
    <div><label>Last name</label><input id="lastName"></div>
  </div>
  <label>Preferred first name</label><input id="preferredName">
</fieldset>

<fieldset><legend>Contact</legend>
  <label>Email</label><input id="email">
  <label>Phone</label><input id="phone">
  <div class="row">
    <div><label>City</label><input id="city"></div>
    <div><label>State / region</label><input id="region"></div>
  </div>
  <div class="row">
    <div><label>Country</label><input id="country"></div>
    <div><label>Postcode</label><input id="postcode"></div>
  </div>
  <label>Street address</label><input id="address">
</fieldset>

<fieldset><legend>Links and work</legend>
  <label>LinkedIn</label><input id="linkedin">
  <label>GitHub</label><input id="github">
  <label>Website or portfolio</label><input id="website">
  <div class="row">
    <div><label>Current company</label><input id="currentCompany"></div>
    <div><label>Current title</label><input id="currentTitle"></div>
  </div>
</fieldset>

<fieldset><legend>Résumé</legend>
  <label>PDF or Word file</label><input id="resume" type="file" accept=".pdf,.doc,.docx,.txt">
  <p id="resumeName" class="note" style="margin-top:8px"></p>
</fieldset>

<button id="save">Save</button><span id="saved"></span>
<script src="options.js"></script>
