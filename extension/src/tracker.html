<!doctype html>
<meta charset="utf-8">
<title>Unsaturated — my applications</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 1000px; margin: 28px auto 60px; padding: 0 16px; color: #111; }
  h1 { font-size: 19px; margin-bottom: 2px; }
  .sub { color: #666; margin-top: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  .pill { border: 1px solid #ddd; border-radius: 999px; padding: 3px 10px; background: #fff; cursor: pointer; font: inherit; font-size: 12px; }
  .pill.on { background: #111; color: #fff; border-color: #111; }
  input[type=search] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; min-width: 200px; }
  button.act { padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .03em; }
  td input, td select { font: inherit; padding: 3px 5px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; }
  td.when { white-space: nowrap; color: #555; font-size: 12px; }
  .empty { padding: 30px; text-align: center; color: #777; border: 1px dashed #ddd; border-radius: 8px; }
  .del { background: none; border: 0; color: #a33; cursor: pointer; }
  @media (max-width: 700px) { td.when, th.when { display: none; } }
</style>

<h1>My applications</h1>
<p class="sub">Every form the extension filled is logged here. Press <strong>I submitted it</strong> on the
panel after you submit, or change the status below. Stored in this browser only.
<a href="options.html">Your details</a></p>

<div class="bar">
  <span id="filters"></span>
  <input type="search" id="q" placeholder="Search company or role">
  <button class="act" id="csv">Download CSV</button>
</div>
<div id="list"></div>
<script type="module" src="tracker.js"></script>
