<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark: a crowded field, and the one opening in it.

    Six dim dots packed together are the jobs everybody has already found. The
    single bright one, ringed and set slightly apart, is the uncontested role —
    which is the entire product in one picture.

    Colours are hard-coded because a favicon renders outside the page, where CSS
    custom properties do not exist. They are the same green and grey the
    saturation scale uses, so the icon and the job cards mean the same thing.
  -->
  <rect width="32" height="32" rx="7" fill="#101014"/>

  <!-- the crowd -->
  <circle cx="8"  cy="9"  r="2.1" fill="#6b6b78" opacity="0.55"/>
  <circle cx="14" cy="7"  r="1.7" fill="#6b6b78" opacity="0.40"/>
  <circle cx="7"  cy="16" r="1.7" fill="#6b6b78" opacity="0.45"/>
  <circle cx="13" cy="14" r="2.1" fill="#6b6b78" opacity="0.55"/>
  <circle cx="9"  cy="23" r="1.7" fill="#6b6b78" opacity="0.40"/>
  <circle cx="16" cy="21" r="1.6" fill="#6b6b78" opacity="0.35"/>

  <!-- the opening -->
  <circle cx="23" cy="16" r="6.4" fill="none" stroke="#4ade80" stroke-width="1.3" opacity="0.42"/>
  <circle cx="23" cy="16" r="3.5" fill="#4ade80"/>
</svg>
