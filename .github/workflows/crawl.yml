# Hourly crawl into Supabase.
#
# The crawl cannot run inside the website: Netlify functions cap at 30s and a
# full crawl is minutes. It runs here instead, writes straight to the database,
# and the site reads that — so refreshing the jobs never involves a deploy.
#
# This workflow deliberately does not deploy anything. Shipping code is a
# separate, manual decision in deploy.yml.
name: crawl

on:
  schedule:
    # Six slots an hour, not because we want six crawls but because GitHub's
    # scheduler is unreliable: measured over 22 hours, 1 of 66 declared slots
    # actually fired (1.5%), leaving a 12.4-hour gap with no crawl at all. Every
    # green run in that window was triggered by hand.
    #
    # The crawler refuses to run twice within 45 minutes, so at most one or two
    # of these do real work and the rest exit in seconds. The repo is public, so
    # Actions minutes are unmetered — the old "2,000 minutes on a private repo"
    # budget this cadence was tuned against no longer applies.
    #
    # Offset off the hour because GitHub delays jobs queued on the hour and
    # drops them outright under load.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Crawl even if the corpus was refreshed in the last 45 minutes'
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded so the crawl stays short as the registry grows. Four parallel jobs
    # each take a quarter of the boards by index, so every board is covered
    # exactly once. Close-detection is already scoped to boards that returned
    # data in the same run, so one shard cannot close another shard's postings.
    #
    # fail-fast off: one shard hitting a bad board must not cancel the other
    # three and leave three quarters of the corpus unrefreshed.
    strategy:
      fail-fast: false
      # ONE shard while the registry is small. Four shards at 1,481 boards would
      # present 32 simultaneous connections to the same vendors instead of 8, for
      # no gain — the whole crawl already finishes in ~75 seconds. Widen this to
      # [0, 1, 2, 3] once seeding has pushed the board count into the thousands,
      # and change --of to match.
      matrix:
        shard: [0]
    # Per shard, so the four run alongside each other but a slow shard is never
    # overlapped by the next run's copy of itself. `matrix` is only in scope at
    # job level — a workflow-level group referencing it silently resolves to
    # empty and gives every run its own group, which is no protection at all.
    concurrency:
      group: crawl-shard-${{ matrix.shard }}
      cancel-in-progress: false
    # Needed by the failure step below, which files/updates an issue.
    permissions:
      contents: read
      issues: write

    # GitHub forbids the `secrets` context inside a step-level `if:`, so the
    # presence check is resolved once here into a plain env var the steps can
    # read. Without this the workflow fails to parse entirely.
    env:
      HAS_SUPABASE: ${{ (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Preferred path: crawl straight into Supabase. No redeploy, so a run is
      # ~70s instead of ~4min and the site is current the moment it finishes.
      - name: Crawl into Supabase
        if: env.HAS_SUPABASE == 'yes'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
        run: npm run crawl:db -- --shard ${{ matrix.shard }} --of 1 ${{ inputs.force && '--force' || '' }}

      # No Supabase key means the crawl cannot store anything, and there is no
      # deploy fallback: this workflow must never publish the site. Fail loudly
      # so the issue below gets raised rather than reporting a green run that
      # wrote nothing.
      - name: Fail if the write key is missing
        if: env.HAS_SUPABASE == 'no'
        run: |
          echo "No SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY is set."
          echo "The crawl has nowhere to write. Add the secret and re-run."
          exit 1

      # Make failure visible. Until now the only signal was a red square in the
      # Actions tab that nobody checks — so the pipeline could stop entirely
      # while the site kept serving plausible-looking data under a recent
      # timestamp. One open issue is kept and reused rather than filing a new
      # one per failure.
      - name: Raise an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label crawl-failure --state open \
            --json number --jq '.[0].number // empty')
          body="Crawl run failed: $RUN_URL

          The corpus was not refreshed. If this keeps failing the site will fall
          back to the build-time snapshot after 6 hours."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'Crawl is failing' --label crawl-failure --body "$body"
          fi
