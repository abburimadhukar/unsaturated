# Hourly crawl + deploy.
#
# The crawl cannot run inside the website: Netlify functions cap at 30s and a
# full crawl takes ~30s and climbing. So it runs here instead, where the job
# limit is 6 hours, and the result is baked into the deploy.
#
# Once Supabase is wired this workflow stops deploying and simply writes to the
# database — the site will then read fresh data without a rebuild.
name: crawl

on:
  schedule:
    # Six slots an hour, not because we want six crawls but because GitHub's
    # scheduler is unreliable: measured over 22 hours, 1 of 66 declared slots
    # actually fired (1.5%), leaving a 12.4-hour gap with no crawl at all. Every
    # green run in that window was triggered by hand.
    #
    # The crawler refuses to run twice within 45 minutes, so at most one or two
    # of these do real work and the rest exit in seconds. The repo is public, so
    # Actions minutes are unmetered — the old "2,000 minutes on a private repo"
    # budget this cadence was tuned against no longer applies.
    #
    # Offset off the hour because GitHub delays jobs queued on the hour and
    # drops them outright under load.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Crawl even if the corpus was refreshed in the last 45 minutes'
        type: boolean
        default: false

# A slow crawl must never overlap with the next one — nor with a deploy, which
# runs its own full crawl to bake the snapshot. Sharing one group with deploy.yml
# stops both sweeping all 1,437 boards at once: 16 simultaneous connections
# presented to the same ATS vendors under a single user agent is exactly the
# behaviour the crawler's concurrency limit exists to avoid.
concurrency:
  group: crawl-or-deploy
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed by the failure step below, which files/updates an issue.
    permissions:
      contents: read
      issues: write

    # GitHub forbids the `secrets` context inside a step-level `if:`, so the
    # presence check is resolved once here into a plain env var the steps can
    # read. Without this the workflow fails to parse entirely.
    env:
      HAS_SUPABASE: ${{ (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Caching npm keeps each run near a minute, which matters against the
          # 2,000 minute/month budget on a private repo.
          cache: npm

      - run: npm ci

      # Preferred path: crawl straight into Supabase. No redeploy, so a run is
      # ~70s instead of ~4min and the site is current the moment it finishes.
      - name: Crawl into Supabase
        if: env.HAS_SUPABASE == 'yes'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
        run: npm run crawl:db -- ${{ inputs.force && '--force' || '' }}

      # Fallback while the service-role key is missing: bake a snapshot and
      # redeploy. Slower and costlier in Actions minutes, but it keeps the site
      # fresh rather than letting it freeze.
      - name: Crawl and redeploy (no Supabase key)
        if: env.HAS_SUPABASE == 'no'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
        run: npx --yes netlify-cli@latest deploy --build --prod

      # Make failure visible. Until now the only signal was a red square in the
      # Actions tab that nobody checks — so the pipeline could stop entirely
      # while the site kept serving plausible-looking data under a recent
      # timestamp. One open issue is kept and reused rather than filing a new
      # one per failure.
      - name: Raise an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label crawl-failure --state open \
            --json number --jq '.[0].number // empty')
          body="Crawl run failed: $RUN_URL

          The corpus was not refreshed. If this keeps failing the site will fall
          back to the build-time snapshot after 6 hours."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'Crawl is failing' --label crawl-failure --body "$body"
          fi
