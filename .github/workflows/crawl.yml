# Hourly crawl into Supabase.
#
# The crawl cannot run inside the website: Netlify functions cap at 30s and a
# full crawl is minutes. It runs here instead, writes straight to the database,
# and the site reads that — so refreshing the jobs never involves a deploy.
#
# This workflow deliberately does not deploy anything. Shipping code is a
# separate, manual decision in deploy.yml.
name: crawl

on:
  schedule:
    # Six slots an hour, not because we want six crawls but because GitHub's
    # scheduler is unreliable: measured over 22 hours, 1 of 66 declared slots
    # actually fired (1.5%), leaving a 12.4-hour gap with no crawl at all. Every
    # green run in that window was triggered by hand.
    #
    # The crawler refuses to run twice within 45 minutes, so at most one or two
    # of these do real work and the rest exit in seconds. The repo is public, so
    # Actions minutes are unmetered — the old "2,000 minutes on a private repo"
    # budget this cadence was tuned against no longer applies.
    #
    # Offset off the hour because GitHub delays jobs queued on the hour and
    # drops them outright under load.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Crawl even if the corpus was refreshed in the last 45 minutes'
        type: boolean
        default: false
      # A MEASUREMENT, not a setting to leave turned up.
      #
      # Workable and iCIMS are refused by Cloudflare from Actions runners — 796
      # and 82 refusals in one run on 22 September — and the crawler reads a 429
      # as "slow down" and widens its gap to 4 seconds. At that pace a quarter
      # of Workable is 58 minutes against a 40-minute ceiling, which is what
      # cancelled the 04:46 run that day and threw away its whole shard.
      #
      # Eight shards halves each lane. Whether that helps depends on something
      # only a run can answer: if the block follows the IP, each runner gets its
      # own budget and the refusals per runner halve; if it follows the Azure
      # range every runner shares, eight shards is eight times the pressure and
      # makes it worse. Run it once, compare the refusal counts, then decide.
      shards:
        description: 'How many shards to split the crawl across'
        type: choice
        default: '4'
        options: ['4', '8']

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 40, not 25. Reading a description for unclassified postings roughly
    # doubles a shard's runtime — measured at 23 minutes against the old
    # ceiling, which is close enough that one slow vendor would kill the run,
    # and a crawl that times out writes nothing at all.
    timeout-minutes: 40
    # Sharded so the crawl stays short as the registry grows. Four parallel jobs
    # each take a quarter of the boards by index, so every board is covered
    # exactly once. Close-detection is already scoped to boards that returned
    # data in the same run, so one shard cannot close another shard's postings.
    #
    # fail-fast off: one shard hitting a bad board must not cancel the other
    # three and leave three quarters of the corpus unrefreshed.
    strategy:
      fail-fast: false
      # Four by default, because seeding pushed the registry from 1,481 boards
      # to 11,991 and a single process stopped finishing: three consecutive runs
      # were killed at the timeout having done the work and written nothing. One
      # shard was right at 1,481 — four would have been 32 simultaneous
      # connections to the same vendors for no gain.
      #
      # The scheduled run always takes the default, because `inputs` is empty on
      # a schedule. So the eight-shard measurement described above can be run by
      # hand without becoming the cadence by accident.
      matrix:
        shard: ${{ fromJSON(inputs.shards == '8' && '[0,1,2,3,4,5,6,7]' || '[0,1,2,3]') }}
    # Per shard, so the four run alongside each other but a slow shard is never
    # overlapped by the next run's copy of itself. `matrix` is only in scope at
    # job level — a workflow-level group referencing it silently resolves to
    # empty and gives every run its own group, which is no protection at all.
    concurrency:
      group: crawl-shard-${{ matrix.shard }}
      cancel-in-progress: false
    # Needed by the failure step below, which files/updates an issue.
    permissions:
      contents: read
      issues: write

    # GitHub forbids the `secrets` context inside a step-level `if:`, so the
    # presence check is resolved once here into a plain env var the steps can
    # read. Without this the workflow fails to parse entirely.
    env:
      HAS_SUPABASE: ${{ (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Preferred path: crawl straight into Supabase. No redeploy, so a run is
      # ~70s instead of ~4min and the site is current the moment it finishes.
      - name: Crawl into Supabase
        if: env.HAS_SUPABASE == 'yes'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
          # No Cloudflare credentials. The crawl held them only to fingerprint
          # jobs for resume matching, which was removed on 25 Sep 2026 — and the
          # fallback was the deploy token, which can edit Workers: more power than
          # an hourly crawl should hold for a feature it no longer has.
        run: npm run crawl:db -- --shard ${{ matrix.shard }} --of ${{ inputs.shards || '4' }} ${{ inputs.force && '--force' || '' }}

      # No Supabase key means the crawl cannot store anything, and there is no
      # deploy fallback: this workflow must never publish the site. Fail loudly
      # so the issue below gets raised rather than reporting a green run that
      # wrote nothing.
      - name: Fail if the write key is missing
        if: env.HAS_SUPABASE == 'no'
        run: |
          echo "No SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY is set."
          echo "The crawl has nowhere to write. Add the secret and re-run."
          exit 1

      # Make failure visible. Until now the only signal was a red square in the
      # Actions tab that nobody checks — so the pipeline could stop entirely
      # while the site kept serving plausible-looking data under a recent
      # timestamp. One open issue is kept and reused rather than filing a new
      # one per failure.
      # cancelled() as well as failure(): GitHub reports a job killed by the
      # timeout as CANCELLED, not failed. Three crawls in a row hit the timeout
      # and raised nothing, which is exactly the silent-pipeline problem this
      # step exists to prevent.
      - name: Raise an issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label crawl-failure --state open \
            --json number --jq '.[0].number // empty')
          body="Crawl run failed: $RUN_URL

          The corpus was not refreshed. If this keeps failing the site will fall
          back to the build-time snapshot after 6 hours."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'Crawl is failing' --label crawl-failure --body "$body"
          fi

  # Store the filter counts, once EVERY shard has finished.
  #
  # This ran inside the crawl until 2 Oct 2026, on shard 0, the moment that one
  # shard finished — while shards 1-3 kept crawling and writing for minutes
  # afterwards, against a database whose cache the crawl had just flushed. A
  # cold feed_facets is ~13 s and the write client gets 8, so it lost:
  #
  #   13:35:30  facet snapshot attempt 1 of 3 did not come back
  #   13:36:08  facet snapshot attempt 2 of 3 did not come back
  #   13:36:48  facet snapshot attempt 3 of 3 did not come back
  #
  # The first attempt failed on every recent crawl and the counts had gone seven
  # and a half hours unwritten. It was invisible because nothing read them until
  # the stored shapes were made to match what a browser actually sends.
  #
  # `needs: crawl` is the whole fix — the same pattern the warm job below has
  # always used. By the time this runs the shards are done and the database is
  # quiet. `if: always()` because a run where one shard failed still refreshed
  # most of the corpus, and counts over three quarters of it beat none.
  #
  # This job going red is a REAL signal and is meant to be noticed: the site now
  # depends on these numbers rather than merely preferring them. It cannot fail
  # the crawl — the jobs are already stored by the time this starts — and the
  # site falls back to counting live, so a failure is visible without being an
  # outage.
  counts:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    # Twenty computations, each capped at the write client's 8 s with one retry,
    # plus npm ci. Comfortably inside this.
    timeout-minutes: 15
    concurrency:
      group: facet-counts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Store the filter counts
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run snapshot:facets

  # Warm the edge cache once the crawl has written the new data.
  #
  # A separate job that NEEDS the crawl, so it runs after all four shards finish
  # rather than once per shard. `if: always()` because even a run where one shard
  # failed still refreshed three quarters of the corpus, and the views worth
  # warming are the common landing pages, not any one shard's boards.
  #
  # This is what closes the one gap the cache headers cannot: the first request
  # for a view that has fallen out of cache hits the database cold. Warming it
  # here means a real visitor gets the already-cached copy instead. Best-effort —
  # see scripts/warm-cache.mjs — so it never blocks or fails the crawl.
  warm:
    # AFTER the counts, not just after the crawl. Warming a view whose counts
    # have not been stored yet makes the origin compute them live and caches the
    # slow answer — the opposite of the point. `if: always()` still applies, so
    # a counts job that failed does not stop the warming.
    needs: [crawl, counts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Belt and braces: warming runs against the deployed site, so nothing else in
    # the run can touch each other, but keep one warm from overlapping the next.
    concurrency:
      group: warm-cache
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # The script is plain Node with no dependencies, so no npm ci is needed —
      # just a runtime with global fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Warm the common views
        env:
          # Overridable for a staging host; defaults to the live site.
          WARM_BASE_URL: ${{ vars.WARM_BASE_URL }}
        run: npm run warm
