# Hourly crawl + deploy.
#
# The crawl cannot run inside the website: Netlify functions cap at 30s and a
# full crawl takes ~30s and climbing. So it runs here instead, where the job
# limit is 6 hours, and the result is baked into the deploy.
#
# Once Supabase is wired this workflow stops deploying and simply writes to the
# database — the site will then read fresh data without a rebuild.
name: crawl

on:
  schedule:
    # Every 2 hours, at 17 past.
    #
    # Not hourly, because of the minutes budget: a run costs ~4.1 min, of which
    # 174s is the Netlify deploy. Hourly would be ~2,950 min/month against the
    # 2,000 free minutes a private repo gets - the workflow would simply stop
    # partway through each month. Every 2 hours is ~1,480 min, which fits.
    #
    # This goes back to hourly once the crawler writes to Supabase instead of
    # redeploying: without the deploy step a run is ~70s, and even hourly is
    # only ~840 min.
    #
    # 17 past because GitHub delays scheduled jobs queued on the hour, and drops
    # them outright under load.
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

# A slow crawl must never overlap with the next one.
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caching npm keeps each run near a minute, which matters against the
          # 2,000 minute/month budget on a private repo.
          cache: npm

      - run: npm ci

      # Preferred path: crawl straight into Supabase. No redeploy, so a run is
      # ~70s instead of ~4min and the site is current the moment it finishes.
      - name: Crawl into Supabase
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
        run: npm run crawl:db

      # Fallback while the service-role key is missing: bake a snapshot and
      # redeploy. Slower and costlier in Actions minutes, but it keeps the site
      # fresh rather than letting it freeze.
      - name: Crawl and redeploy (no Supabase key)
        if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY == '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
          CRAWLER_CONCURRENCY: '8'
          CRAWLER_DELAY_MS: '120'
        run: npx --yes netlify-cli@latest deploy --build --prod
