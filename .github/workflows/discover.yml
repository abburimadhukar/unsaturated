# Keeps the board registry current without anyone maintaining it by hand.
#
# The list used to grow only when someone ran a discovery command locally and
# committed the result, so in practice it did not grow at all. This reads the
# Common Crawl URL index — where ATS board tokens are simply the first path
# segment of every archived board URL — verifies what it finds against the live
# vendor APIs, and stores the ones that answer.
#
# Weekly, because Common Crawl publishes roughly monthly and verification is
# deliberately slow. Writes to the database only; it never deploys.
name: discover

on:
  schedule:
    # Sunday, off the hour. Nothing depends on the exact minute.
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Common Crawl collection, e.g. CC-MAIN-2026-34 (blank = latest)'
        type: string
        default: ''
      verify:
        description: 'How many newly found boards to verify this run'
        type: string
        default: '3000'

jobs:
  discover:
    runs-on: ubuntu-latest
    # One vendor per job, so four run in parallel while each ATS still sees
    # exactly one request per second. Splitting by count instead would point
    # every runner at every vendor at once, which is what makes Greenhouse drop
    # connections and live boards get recorded as dead.
    strategy:
      fail-fast: false
      # Two at a time, not eleven.
      #
      # Every shard reads Common Crawl's query server, and eleven arriving
      # together is more than it will take: one run logged CDX 502, 503 and 504
      # across most patterns, three vendors read zero urls, and the same pattern
      # returned 2,388, 2,410, 9,154 and 12,110 urls in four different jobs of
      # that one run. Cutting each shard to its own vendor removed ~85% of the
      # load and was still not enough, because the problem is simultaneity
      # rather than volume.
      #
      # Two keeps a little parallelism for the verification phase — which talks
      # to the ATS vendors, not to Common Crawl — while the index sees a queue
      # instead of a stampede. The ceiling below has room for the longer wall
      # clock this implies.
      max-parallel: 2
      matrix:
        # smartrecruiters and workable were already being READ from the index —
        # their patterns have always been in commoncrawl.ts — and then discarded,
        # because --provider filters the harvest and neither was ever named here.
        # personio is new: its company lives in the subdomain rather than the
        # path, so it needed its own pattern.
        #
        # These five have working, proven adapters and 310 boards between them
        # from the original file. Scaling them is the cheapest corpus growth
        # available while Common Crawl has nothing left for greenhouse, workday,
        # ashby and lever.
        # rippling added 9 Sep 2026. It was one of "these five" above and had an
        # adapter all along; only the harvest pattern and this line were missing,
        # plus an endpoint() case in verify.ts without which every candidate
        # would have verified as "unknown" and been silently discarded.
        #
        # oracle added 15 Sep 2026 — Oracle Cloud Recruiting, the largest hiring
        # system that was still unconnected. Measured that day against
        # CC-MAIN-2026-34: 38,335 indexed urls yielded 1,170 boards nobody held,
        # and 25 of 25 sampled answered HTTP 200 with 2,710 postings between
        # them — 108 per board, against Workday's 6.7 and Greenhouse's 2.4.
        provider: [greenhouse, workday, ashby, lever, smartrecruiters, workable, personio, bamboohr, ukg, recruitee, teamtailor, rippling, oracle]
    # Per vendor, and at JOB level: `matrix` is not in scope for workflow-level
    # concurrency — GitHub refuses to parse the file at all. The same mistake was
    # already made and fixed in crawl.yml. Per-vendor grouping lets the shards run
    # alongside each other while a slow shard is never overlapped by the next
    # run's copy of itself.
    concurrency:
      group: discover-${{ matrix.provider }}
      cancel-in-progress: false
    # Verification runs at ~1 request/second on purpose — Greenhouse drops
    # bursts from datacenter IPs, and a dropped connection is not a dead board.
    # A token that failed in a fast batch answered perfectly seconds later with
    # 730 KB of jobs, so going faster does not merely risk a block: it records
    # live companies as dead and deletes them.
    #
    # The cap is 3,000, not 600. That is 50 minutes of checking at the SAME
    # request rate — it spends time already allotted rather than pushing any
    # vendor harder. At 600 a backlog built up the moment five providers were
    # switched on together: 1,781 BambooHR boards, 867 Personio and 780 UKG left
    # waiting for a run a week away. Nothing about the politeness changes.
    #
    # 50 minutes against a 90-minute ceiling leaves room for the harvest itself
    # and for a slow vendor, so a full run still cannot be killed mid-write.
    #
    # Raised to 180 on 15 Sep 2026, when a SECOND harvest-and-verify step was
    # added for the Internet Archive. The ceiling was sized for one verification
    # pass and there are now two, each capped at 3,000 boards at one request a
    # second — 50 minutes apiece. The greenhouse shard is the worst case, since
    # it also carries the 600-board re-verification below: 50 + 50 + 10 is 110
    # minutes of checking alone, before either index has been read.
    #
    # In practice a run is a fraction of this. The ceiling exists so that a run
    # is never killed part-way through writing, which would leave the registry
    # holding a partial harvest and no record of where it stopped.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write

    env:
      HAS_SUPABASE: ${{ (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail if the write key is missing
        if: env.HAS_SUPABASE == 'no'
        run: |
          echo "No SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY is set."
          echo "Discovery has nowhere to store what it finds."
          exit 1

      - name: Harvest new boards from Common Crawl
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
        run: |
          npm run harvest:cc -- \
            --provider ${{ matrix.provider }} \
            ${{ inputs.crawl && format('--crawl {0}', inputs.crawl) || '' }} \
            --verify ${{ inputs.verify || '3000' }}

      # The same harvest against the Internet Archive.
      #
      # WHY A SECOND INDEX
      #
      # Common Crawl publishes roughly monthly, and on 15 Sep 2026 the newest
      # collection was still CC-MAIN-2026-34 — late August. This job had
      # therefore been re-reading the same index every Sunday for five weeks and
      # finding, by construction, nothing new. An index that only moves monthly
      # cannot keep a registry current in between.
      #
      # The Archive is written to continuously. Measured 15 Sep 2026 on captures
      # since 1 June: 525 unregistered Greenhouse tokens at a 68% live rate and
      # 996 unregistered Ashby tokens at 50% — roughly 850 employers nobody was
      # watching. Same patterns, same verifier, same store; only `source`
      # differs, so it can be told afterwards which index earned its keep.
      #
      # continue-on-error because this is the newer of the two and the Archive
      # does go down (it was offline for part of the afternoon this was built).
      # A failure here must not take the Common Crawl harvest above red with it.
      - name: Harvest new boards from the Internet Archive
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
        run: |
          npm run harvest:ia -- \
            --provider ${{ matrix.provider }} \
            --verify ${{ inputs.verify || '3000' }}

      # Re-checks registered boards so genuinely closed ones drop out instead of
      # failing every crawl forever. A board is retired only after several
      # consecutive failures.
      #
      # One shard only: all four would re-check the same boards. It now takes the
      # least recently confirmed ones, so the window rotates through the whole
      # registry — it used to take a fixed alphabetical slice, re-checking the
      # same first 600 every week and never reaching the other 11,612.
      - name: Re-verify the least recently confirmed boards
        if: matrix.provider == 'greenhouse'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRAWLER_USER_AGENT: 'unsaturated-jobscout/0.1 (+https://github.com/abburimadhukar/unsaturated)'
        run: npm run boards:verify -- --limit 600

      - name: Raise an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label discovery-failure --state open \
            --json number --jq '.[0].number // empty')
          body="Board discovery failed: $RUN_URL

          The registry was not updated. Existing boards keep crawling normally,
          so this is not urgent, but the list will go stale if it keeps failing."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'Board discovery is failing' --label discovery-failure --body "$body"
          fi
