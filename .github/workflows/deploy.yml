# Deploy the site whenever its code changes.
#
# Until now the site only shipped when someone ran the Netlify CLI by hand, so a
# fix could sit merged on main and never reach a visitor. Job data does not need
# this — the crawler writes to Supabase and the site reads it live — but code
# does.
name: deploy

# MANUAL ONLY, deliberately.
#
# This used to run on every push to main, which meant pushing code to GitHub was
# the same action as deploying to Netlify — there was no way to land work without
# shipping it. Deploying is now an explicit decision: trigger this workflow from
# the Actions tab, or `gh workflow run deploy.yml`.
#
# Restore the push trigger only if you want merges to ship automatically again.
on:
  workflow_dispatch: {}

# Shares a group with crawl.yml. `netlify deploy --build` runs the snapshot
# crawl, so a deploy and a scheduled crawl overlapping means two full 1,437-board
# sweeps at once. cancel-in-progress is off because the thing we might cancel is
# a crawl mid-write, not just a redundant deploy.
concurrency:
  group: crawl-or-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--build` runs Netlify's own pipeline, which is required for Next.js:
      # the @netlify/plugin-nextjs adapter turns the build output into
      # functions. A bare `next build` plus `--dir=.next` uploads static files
      # and silently loses every API route.
      #
      # That pipeline uses netlify.toml's command, which also bakes the crawl
      # snapshot. Slower than strictly necessary, but it keeps the fallback the
      # site relies on when the database is unreachable.
      - name: Build and deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --build --prod
