# Registry repairs. Manual only, and both of them undo damage the registry did
# to itself rather than routine work.
#
#   revive  — boards retired for refusing us rather than for dying
#   dedupe  — one company registered under two spellings of its own name
#
# On 6 September 2026 the crawler retired 2,263 boards in an afternoon. 2,185
# carried an HTTP 429 — a rate limit — against 16 that were genuinely 404. Six
# sampled at random answered 200 with between 3 and 86 live jobs still on them.
#
# The cause is fixed in the crawler: a refusal no longer advances the counter
# that ends in deactivation. This undoes the damage already done.
#
# Manual only. Reviving boards is a repair, not routine work, and if it ever
# needs running twice something upstream is still wrong.
name: revive

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Which repair to run'
        type: choice
        options:
          - revive
          - dedupe
        default: revive
      dryRun:
        description: 'Report what would change, without writing'
        type: boolean
        default: true

jobs:
  revive:
    runs-on: ubuntu-latest
    concurrency:
      group: revive
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      HAS_SUPABASE: ${{ (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail if the write key is missing
        if: env.HAS_SUPABASE == 'no'
        run: |
          echo "No SUPABASE_SECRET_KEY / SUPABASE_SERVICE_ROLE_KEY is set."
          exit 1

      - name: Repair
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Two repairs, one place. Both undo damage the registry did to itself:
        # revive brings back boards retired for refusing us, dedupe merges
        # companies registered under two spellings of the same name.
        run: |
          FLAG=""
          if [ "${{ inputs.dryRun }}" = "true" ]; then FLAG="-- --dry-run"; fi
          case "${{ inputs.action }}" in
            dedupe) npm run boards:dedupe $FLAG ;;
            *)      npm run boards:revive $FLAG ;;
          esac
