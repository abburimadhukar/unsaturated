# Deploy the site to Cloudflare Workers.
#
# Manual only. Cloudflare is the only host now: the Netlify deploy workflow is
# gone and that version is preserved as the netlify-final tag.
#
# Deliberately not automatic on push, so landing a crawler fix does not also
# republish the website. Shipping stays a separate decision.
#
# The crawler is untouched by any of this. It runs in crawl.yml, writes to
# Supabase, and does not care which host serves the website.
name: deploy-cloudflare

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `opennextjs-cloudflare build` runs `next build` first, then repackages
      # the output for Workers. The build no longer crawls, so this is fast.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy

      # Worker secrets are runtime bindings, not build-time environment
      # variables: passing SUPABASE_SECRET_KEY to the build would compile it into
      # nothing useful and the deployed Worker would fall back to the publishable
      # key, which no longer has write permission. It has to be uploaded to the
      # Worker itself, which requires the Worker to exist — hence after deploy.
      #
      # Reads work without it; only saving a resume or marking a job applied
      # needs it.
      - name: Upload the Supabase write key to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: printf '%s' "$SUPABASE_SECRET_KEY" | npx wrangler secret put SUPABASE_SECRET_KEY

      # Same reasoning as the Supabase key above: a runtime binding, uploaded
      # after the Worker exists. Without this the tailoring route reports
      # "not configured" on a deployed site while the secret sits perfectly
      # happily in GitHub — a failure with no error anywhere to find.
      #
      # `printf` rather than `echo` so no trailing newline becomes part of the
      # key, which would make every OpenAI call a 401 for a reason nothing says.
      - name: Upload the OpenAI key to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
